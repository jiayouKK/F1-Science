<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科学小课堂</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1 class="page-title">科学小课堂</h1>
  <div class="page-subtitle">点击一课开始学习</div>
  <div id="lesson-list">
    <a href="lesson-01.html" class="lesson-link">
      <span class="lesson-subject">中一科学</span>
      <span class="lesson-title">Chapter 1: Introduction to Scientific Investigation</span>
      <span class="arrow">›</span>
    </a>
  </div>
</div>

<script src="content.js"></script>
<script>
  const list = document.getElementById('lesson-list');
  lessons.forEach(lesson => {
    const a = document.createElement('a');
    a.href = `lesson.html?id=${lesson.id}`;
    a.className = 'lesson-link';
    a.innerHTML = `
      <span class="lesson-subject">${lesson.subject}</span>
      <span class="lesson-title">${lesson.title}</span>
      <span class="arrow">›</span>
    `;
    list.appendChild(a);
  });
</script>
</body>
</html>
